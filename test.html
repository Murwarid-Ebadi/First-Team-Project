<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="src/normalize.css">
    <link rel="stylesheet" href="src/style.css">
</head>
<style>
    .social-links{
    display: block;
    width:  25px;
    height: 25px;
    border-radius: 50%;
    text-align: center;
    align-content: center;
    font-size: 14px;
    transition: 0.5s;
    &:hover{
        background-color: rgba(0, 0, 255, 0.596);
    
    }

    &:nth-of-type(2){
        &:hover{
            background-color: var(--color-Primary-blue);
        }
    }
        &:nth-of-type(3){
        &:hover{
            background-color:rgb(0, 140, 255) ;
        }
    }
    
} 
._lis{
    height: 100%;
    width: 100%;
    >a{
        width: 100%;
        height: 100%;
        position: relative;
        display: block;
        transition:0.5s ;
        align-content: center;
        &:hover{
            color: rgba(0, 255, 255, 0.692);
            &::after{
                width: 100%;
                opacity: 1;
                transition: 0.5s ease;
            }
        }
            &::after{
        content:'';
        display: block;
        width: 0;
        height: 3px;
        position: absolute;
        left: 0;
        bottom: 5px;
        background-color: aqua;
        margin-right: 3px;
        opacity:0 ;
        }
    }
}

.dropdown.hidden{
    visibility: visible;
}

</style>
<body>
    <header class=" w-full h-20 border px-2   " >
    <section class="w-full  container mx-auto  py-5 flex items-center justify-between relative">  
        <!-- logo -->
        <figure class=" w-35 h-10 border "><img  class="w-full h-full" src="src/img/logo.png" alt=""></figure>
        <!-- social  icons -->
        
        <!-- number and list  -->
        <figure class=" h-10 border flex justify-between items-center gap-2.5" >
        <!-- UL lG  -->          
            <ul class=" h-full  gap-5 justify-center items-center relative mr-4 hidden lg:flex">
                <li></li>
                <li class="_lis"><a href="">Home</a></li>
                <li class="_lis"><a href="">About</a></li>
                <li class="_lis"><a href="">Team</a></li>
                <li class="_lis"><a href="">Works</a></li>
                <li class="_lis"><a href="">Pricing</a></li>
                <li class="_lis"><a href="">Blog</a></li>
                <li class="_lis"><a href="">Contents</a></li>
            </ul>
            <figure  class="h-10 border  justify-center  items-center flex  gap-2  ">
            <span class="social-links "><i class="bi bi-facebook"></i></span>
            <span class="social-links"><i class="bi bi-twitter-x"></i></span>   
            <span class="social-links"><i class="bi bi-instagram"></i></span>
        </figure>

            <!-- span num  -->
            <span ><a class="hover:text-cyan-500 transition-all duration-400 text-[18px] "  href="">(800) 123-4567</a></span>  
            <!-- sapn list  -->
            <span class="list w-13 h-10 bg-cyan-500 flex justify-center items-center">
                <i class="bi bi-list"></i>
                <figure class="dropdown w-full h-50 border absolute left-0 top-20 lg:hidden transition-all duration-300"></figure>
            </span>
        </figure>
        
    </section> 
    </header> 
</body>
<script>
let list = document.querySelector('.list')
let dropdown = list.querySelector('.dropdown')

list.addEventListener('click', () => {
    dropdown.classList.toggle('hidden')
})
</script>
</html>
